<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reaction Test — CAOSLAB</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <style>

        .reaction-page {

            min-height:
                calc(100vh - 70px);

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 30px 20px;

            text-align: center;

        }


        .reaction-container {

            width: 100%;

            max-width: 650px;

        }


        .reaction-back {

            display: inline-block;

            margin-bottom: 30px;

            color: #777;

        }


        .reaction-back:hover {

            color: white;

        }


        .reaction-icon {

            font-size: 60px;

            margin-bottom: 10px;

        }


        .reaction-container h1 {

            font-size:
                clamp(35px, 8vw, 60px);

            margin-bottom: 10px;

        }


        .reaction-subtitle {

            color: #777;

            margin-bottom: 25px;

        }


        .reaction-area {

            width: 100%;

            min-height: 280px;

            box-sizing: border-box;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 30px;

            border-radius: 20px;

            border: 2px solid #29292d;

            background: #151518;

            cursor: pointer;

            user-select: none;

            transition:
                background 0.15s,
                transform 0.1s;

        }


        .reaction-area:active {

            transform: scale(0.99);

        }


        .reaction-area.waiting {

            background: #151518;

        }


        .reaction-area.ready {

            background: white;

            color: black;

            border-color: white;

        }


        .reaction-area.result {

            cursor: default;

        }


        .reaction-message {

            font-size:
                clamp(22px, 5vw, 34px);

            font-weight: 900;

        }


        .reaction-time {

            margin-top: 20px;

            font-size: 42px;

            font-weight: 900;

        }


        .reaction-score {

            margin-top: 10px;

            color: #777;

            font-size: 14px;

        }


        .reaction-record {

            margin-top: 8px;

            color: #555;

            font-size: 12px;

        }


        .reaction-restart {

            display: none;

            width: 100%;

            margin-top: 15px;

            padding: 15px;

            border: 1px solid #333;

            border-radius: 10px;

            background: transparent;

            color: white;

            font-weight: bold;

            cursor: pointer;

        }


        .reaction-share {

            display: none;

            width: 100%;

            margin-top: 10px;

            padding: 15px;

            border: 1px solid #333;

            border-radius: 10px;

            background: transparent;

            color: white;

            font-weight: bold;

            cursor: pointer;

        }


        .reaction-stats {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 10px;

            margin-top: 20px;

        }


        .reaction-stat {

            padding: 15px;

            background: #111114;

            border: 1px solid #29292d;

            border-radius: 12px;

        }


        .reaction-stat-value {

            font-size: 22px;

            font-weight: 900;

        }


        .reaction-stat-label {

            margin-top: 5px;

            color: #666;

            font-size: 10px;

            font-weight: bold;

            letter-spacing: 1px;

        }


        @media (max-width: 500px) {

            .reaction-area {

                min-height: 240px;

            }

        }

    </style>

</head>


<body>


<header class="header">

    <a
        href="../index.html"
        class="logo"
    >
        CAOS<span>LAB</span>
    </a>

</header>



<main class="reaction-page">

    <div class="reaction-container">


        <a
            href="../index.html"
            class="reaction-back"
        >
            ← Volver a CAOSLAB
        </a>


        <div class="reaction-icon">
            ⚡
        </div>


        <h1>
            Reaction Test
        </h1>


        <p class="reaction-subtitle">

            Espera a que aparezca la señal...

            <br>

            ¡Y pulsa lo más rápido posible!

        </p>



        <div
            id="reactionArea"
            class="reaction-area waiting"
        >

            <div
                id="reactionMessage"
                class="reaction-message"
            >
                PULSA PARA EMPEZAR
            </div>

        </div>



        <div
            id="reactionTime"
            class="reaction-time"
        >
            —
        </div>



        <div class="reaction-score">

            Puntos:

            <strong id="currentScore">
                0
            </strong>

        </div>



        <div class="reaction-record">

            Mejor puntuación:

            <strong id="bestScore">
                0
            </strong>

        </div>



        <div class="reaction-stats">

            <div class="reaction-stat">

                <div
                    id="bestTime"
                    class="reaction-stat-value"
                >
                    —
                </div>

                <div class="reaction-stat-label">
                    MEJOR TIEMPO
                </div>

            </div>


            <div class="reaction-stat">

                <div
                    id="attempts"
                    class="reaction-stat-value"
                >
                    0
                </div>

                <div class="reaction-stat-label">
                    PARTIDAS
                </div>

            </div>

        </div>



        <button
            id="restartButton"
            class="reaction-restart"
            type="button"
        >
            JUGAR DE NUEVO
        </button>



        <button
            id="shareButton"
            class="reaction-share"
            type="button"
        >
            📤 COMPARTIR RESULTADO
        </button>


    </div>

</main>



<script src="../js/stats.js"></script>


<script>

(function () {

    "use strict";


    /* ---------------------------------------------------------
       ELEMENTOS
       --------------------------------------------------------- */

    const area =
        document.getElementById(
            "reactionArea"
        );


    const message =
        document.getElementById(
            "reactionMessage"
        );


    const reactionTime =
        document.getElementById(
            "reactionTime"
        );


    const currentScoreText =
        document.getElementById(
            "currentScore"
        );


    const bestScoreText =
        document.getElementById(
            "bestScore"
        );


    const bestTimeText =
        document.getElementById(
            "bestTime"
        );


    const attemptsText =
        document.getElementById(
            "attempts"
        );


    const restartButton =
        document.getElementById(
            "restartButton"
        );


    const shareButton =
        document.getElementById(
            "shareButton"
        );



    /* ---------------------------------------------------------
       VARIABLES
       --------------------------------------------------------- */

    let state = "idle";

    let startTime = 0;

    let timer = null;

    let currentTime = 0;

    let currentScore = 0;

    let attempts = 0;

    let personalBestTime = null;



    /* ---------------------------------------------------------
       CARGAR DATOS
       --------------------------------------------------------- */

    function loadGameData() {

        try {

            const saved =
                localStorage.getItem(
                    "caoslab_reaction_data_v1"
                );


            if (!saved) {

                return;

            }


            const data =
                JSON.parse(saved);


            attempts =
                Number(data.attempts) || 0;


            personalBestTime =
                Number(data.bestTime) || null;


            attemptsText.textContent =
                attempts;


            if (personalBestTime) {

                bestTimeText.textContent =
                    personalBestTime + " ms";

            }

        }

        catch (error) {

            console.warn(
                "CAOSLAB: error cargando datos de Reaction Test."
            );

        }

    }



    /* ---------------------------------------------------------
       GUARDAR DATOS
       --------------------------------------------------------- */

    function saveGameData() {

        try {

            localStorage.setItem(

                "caoslab_reaction_data_v1",

                JSON.stringify({

                    attempts:
                        attempts,

                    bestTime:
                        personalBestTime

                })

            );

        }

        catch (error) {

            console.warn(
                "CAOSLAB: error guardando datos de Reaction Test."
            );

        }

    }



    /* ---------------------------------------------------------
       TIEMPO ALEATORIO
       --------------------------------------------------------- */

    function randomDelay() {

        return Math.floor(
            Math.random() * 3000
        ) + 1500;

    }



    /* ---------------------------------------------------------
       EMPEZAR
       --------------------------------------------------------- */

    function startGame() {

        if (
            state !== "idle"
        ) {

            return;

        }


        state = "waiting";


        area.className =
            "reaction-area waiting";


        message.textContent =
            "ESPERA...";


        reactionTime.textContent =
            "—";


        currentScore = 0;


        currentScoreText.textContent =
            "0";


        restartButton.style.display =
            "none";


        shareButton.style.display =
            "none";


        timer = setTimeout(

            function () {

                state = "ready";


                area.className =
                    "reaction-area ready";


                message.textContent =
                    "⚡ ¡AHORA!";


                startTime =
                    performance.now();

            },

            randomDelay()

        );

    }



    /* ---------------------------------------------------------
       CLIC
       --------------------------------------------------------- */

    function handleClick() {

        /* PREMATURO */

        if (
            state === "waiting"
        ) {

            clearTimeout(timer);


            state = "result";


            area.className =
                "reaction-area result";


            message.textContent =
                "💀 ¡DEMASIADO PRONTO!";


            reactionTime.textContent =
                "—";


            currentScore = 0;


            currentScoreText.textContent =
                "0";


            restartButton.style.display =
                "block";


            return;

        }



        /* REACCIÓN CORRECTA */

        if (
            state === "ready"
        ) {

            currentTime =
                Math.round(
                    performance.now() -
                    startTime
                );


            state = "result";


            area.className =
                "reaction-area result";


            message.textContent =
                getMessage(
                    currentTime
                );


            reactionTime.textContent =
                currentTime + " ms";


            currentScore =
                calculateScore(
                    currentTime
                );


            currentScoreText.textContent =
                currentScore;


            attempts++;


            attemptsText.textContent =
                attempts;



            /* MEJOR TIEMPO */

            let newRecord =
                false;


            if (
                personalBestTime === null ||
                currentTime < personalBestTime
            ) {

                personalBestTime =
                    currentTime;

                newRecord = true;


                bestTimeText.textContent =
                    personalBestTime +
                    " ms";

            }


            saveGameData();



            /* ESTADÍSTICAS */

            if (
                typeof window.CAOSLAB_STATS !==
                "undefined"
            ) {

                window.CAOSLAB_STATS.recordGame(

                    "reaction",

                    "win",

                    currentScore

                );

            }


            if (newRecord) {

                message.textContent +=
                    " 🏆 NUEVO RÉCORD";

            }


            restartButton.style.display =
                "block";


            shareButton.style.display =
                "block";


            return;

        }



        /* RESULTADO */

        if (
            state === "result"
        ) {

            return;

        }



        /* INICIO */

        startGame();

    }



    /* ---------------------------------------------------------
       MENSAJES
       --------------------------------------------------------- */

    function getMessage(time) {

        if (time < 180) {

            return "🤯 ¡VELOCIDAD ABSURDA!";

        }


        if (time < 250) {

            return "🔥 ¡INCREÍBLE!";

        }


        if (time < 350) {

            return "⚡ ¡MUY RÁPIDO!";

        }


        if (time < 500) {

            return "😎 ¡BUENOS REFLEJOS!";

        }


        if (time < 700) {

            return "🙂 NO ESTÁ MAL";

        }


        return "🐌 ¡PUEDES HACERLO MEJOR!";

    }



    /* ---------------------------------------------------------
       PUNTOS
       --------------------------------------------------------- */

    function calculateScore(time) {

        if (time < 150) {

            return 150;

        }


        if (time < 200) {

            return 130;

        }


        if (time < 250) {

            return 110;

        }


        if (time < 300) {

            return 100;

        }


        if (time < 400) {

            return 80;

        }


        if (time < 500) {

            return 60;

        }


        if (time < 700) {

            return 40;

        }


        return 20;

    }



    /* ---------------------------------------------------------
       COMPARTIR
       --------------------------------------------------------- */

    function shareResult() {

        const text =
            "⚡ He conseguido " +
            currentTime +
            " ms en Reaction Test de CAOSLAB y " +
            currentScore +
            " puntos. 🧪";


        if (
            navigator.share
        ) {

            navigator.share({

                title:
                    "CAOSLAB — Reaction Test",

                text:
                    text

            }).catch(
                function () {}
            );


            return;

        }


        if (
            navigator.clipboard
        ) {

            navigator.clipboard
                .writeText(text)
                .then(

                    function () {

                        shareButton.textContent =
                            "✅ RESULTADO COPIADO";

                    }

                )
                .catch(

                    function () {

                        shareButton.textContent =
                            "📋 COPIA EL RESULTADO";

                    }

                );

        }

    }



    /* ---------------------------------------------------------
       REINICIAR
       --------------------------------------------------------- */

    function restartGame() {

        clearTimeout(timer);


        state = "idle";


        startTime = 0;


        currentTime = 0;


        currentScore = 0;


        reactionTime.textContent =
            "—";


        currentScoreText.textContent =
            "0";


        message.textContent =
            "PULSA PARA EMPEZAR";


        area.className =
            "reaction-area waiting";


        restartButton.style.display =
            "none";


        shareButton.style.display =
            "none";


        shareButton.textContent =
            "📤 COMPARTIR RESULTADO";

    }



    /* ---------------------------------------------------------
       EVENTOS
       --------------------------------------------------------- */

    area.addEventListener(
        "click",
        handleClick
    );


    restartButton.addEventListener(
        "click",
        restartGame
    );


    shareButton.addEventListener(
        "click",
        shareResult
    );



    /* ---------------------------------------------------------
       INICIO
       --------------------------------------------------------- */

    loadGameData();


    if (
        typeof window.CAOSLAB_STATS !==
        "undefined"
    ) {

        const stats =
            window.CAOSLAB_STATS.get();


        const gameStats =
            stats.games.reaction;


        if (gameStats) {

            bestScoreText.textContent =
                gameStats.bestScore;

        }

    }


})();

</script>


</body>

</html>
