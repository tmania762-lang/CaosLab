<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Adivina el Número — CAOSLAB</title>

    <link rel="stylesheet" href="../css/style.css">

    <style>

        .number-page {
            min-height: calc(100vh - 70px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            text-align: center;
        }

        .number-container {
            width: 100%;
            max-width: 600px;
        }

        .number-back {
            display: inline-block;
            margin-bottom: 30px;
            color: #777;
        }

        .number-back:hover {
            color: white;
        }

        .number-icon {
            font-size: 60px;
            margin-bottom: 10px;
        }

        .number-container h1 {
            font-size: clamp(35px, 8vw, 60px);
            margin-bottom: 10px;
        }

        .number-subtitle {
            color: #777;
            margin-bottom: 30px;
        }

        .number-input {
            width: 100%;
            padding: 18px;
            margin-bottom: 15px;

            border-radius: 10px;
            border: 1px solid #333;

            background: #151518;
            color: white;

            font-size: 20px;
            text-align: center;
        }

        .number-button {
            width: 100%;
            padding: 18px;

            border: none;
            border-radius: 10px;

            background: white;
            color: black;

            font-size: 17px;
            font-weight: 900;

            cursor: pointer;
        }

        .number-button:active {
            transform: scale(0.98);
        }

        .number-result {
            min-height: 110px;

            margin-top: 25px;
            padding: 25px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #151518;

            border: 1px solid #29292d;

            border-radius: 15px;

            font-size: 20px;
            font-weight: bold;
        }

        .number-attempts {
            margin-top: 15px;

            color: #555;

            font-size: 13px;
        }

        .number-restart {
            display: none;

            width: 100%;

            margin-top: 12px;

            padding: 15px;

            border: 1px solid #333;

            border-radius: 10px;

            background: transparent;

            color: white;

            font-weight: bold;

            cursor: pointer;
        }

    </style>

</head>


<body>


<header class="header">

    <a
        href="../index.html"
        class="logo"
    >
        CAOS<span>LAB</span>
    </a>

</header>


<main class="number-page">

    <div class="number-container">


        <a
            href="../index.html"
            class="number-back"
        >
            ← Volver a CAOSLAB
        </a>


        <div class="number-icon">
            🔢
        </div>


        <h1>
            Adivina el Número
        </h1>


        <p class="number-subtitle">
            Estoy pensando en un número del 1 al 100.
        </p>


        <input
            id="numberInput"
            class="number-input"
            type="number"
            min="1"
            max="100"
            inputmode="numeric"
            placeholder="Escribe un número"
        >


        <button
            id="checkButton"
            class="number-button"
            type="button"
        >
            COMPROBAR
        </button>


        <div
            id="result"
            class="number-result"
        >
            ¿Podrás encontrarlo?
        </div>


        <div class="number-attempts">

            Intentos:
            <span id="attempts">
                0
            </span>

        </div>


        <button
            id="restartButton"
            class="number-restart"
            type="button"
        >
            JUGAR DE NUEVO
        </button>


    </div>

</main>



<script>

(function () {

    "use strict";


    let secretNumber = generateNumber();

    let attempts = 0;


    const input =
        document.getElementById("numberInput");

    const checkButton =
        document.getElementById("checkButton");

    const result =
        document.getElementById("result");

    const attemptsText =
        document.getElementById("attempts");

    const restartButton =
        document.getElementById("restartButton");


    function generateNumber() {

        return Math.floor(
            Math.random() * 100
        ) + 1;

    }


    function checkNumber() {

        const value =
            Number(input.value);


        if (
            !Number.isInteger(value) ||
            value < 1 ||
            value > 100
        ) {

            result.textContent =
                "⚠️ Escribe un número entre 1 y 100.";

            return;

        }


        attempts++;

        attemptsText.textContent =
            attempts;


        if (value === secretNumber) {

            result.textContent =
                "🎉 ¡ACERTASTE! El número era " +
                secretNumber +
                ". Lo conseguiste en " +
                attempts +
                " intentos.";

            checkButton.disabled = true;

            input.disabled = true;

            restartButton.style.display =
                "block";

            return;

        }


        if (value < secretNumber) {

            result.textContent =
                "⬆️ Demasiado bajo. Prueba con un número mayor.";

        }

        else {

            result.textContent =
                "⬇️ Demasiado alto. Prueba con un número menor.";

        }


        input.select();

    }


    function restartGame() {

        secretNumber =
            generateNumber();

        attempts = 0;

        attemptsText.textContent =
            "0";

        result.textContent =
            "¿Podrás encontrarlo?";

        input.value = "";

        input.disabled = false;

        checkButton.disabled = false;

        restartButton.style.display =
            "none";

        input.focus();

    }


    checkButton.addEventListener(
        "click",
        checkNumber
    );


    restartButton.addEventListener(
        "click",
        restartGame
    );


    input.addEventListener(
        "keydown",
        function (event) {

            if (event.key === "Enter") {

                checkNumber();

            }

        }
    );


})();

</script>


</body>

</html>
