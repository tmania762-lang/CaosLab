<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Adivina el Número — CAOSLAB</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <style>

        .number-page {

            min-height:
                calc(100vh - 70px);

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 30px 20px;

            text-align: center;

        }


        .number-container {

            width: 100%;

            max-width: 600px;

        }


        .number-back {

            display: inline-block;

            margin-bottom: 30px;

            color: #777;

        }


        .number-back:hover {

            color: white;

        }


        .number-icon {

            font-size: 60px;

            margin-bottom: 10px;

        }


        .number-container h1 {

            font-size:
                clamp(35px, 8vw, 60px);

            margin-bottom: 10px;

        }


        .number-subtitle {

            color: #777;

            margin-bottom: 30px;

        }


        .number-input {

            width: 100%;

            padding: 18px;

            margin-bottom: 15px;

            box-sizing: border-box;

            border-radius: 10px;

            border: 1px solid #333;

            background: #151518;

            color: white;

            font-size: 20px;

            text-align: center;

        }


        .number-button {

            width: 100%;

            padding: 18px;

            border: none;

            border-radius: 10px;

            background: white;

            color: black;

            font-size: 17px;

            font-weight: 900;

            cursor: pointer;

        }


        .number-button:active {

            transform: scale(0.98);

        }


        .number-button:disabled {

            opacity: 0.5;

            cursor: not-allowed;

        }


        .number-result {

            min-height: 110px;

            margin-top: 25px;

            padding: 25px;

            box-sizing: border-box;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #151518;

            border: 1px solid #29292d;

            border-radius: 15px;

            font-size: 20px;

            font-weight: bold;

        }


        .number-attempts {

            margin-top: 15px;

            color: #555;

            font-size: 13px;

        }


        .number-score {

            margin-top: 8px;

            color: #777;

            font-size: 13px;

        }


        .number-record {

            margin-top: 8px;

            color: #555;

            font-size: 12px;

        }


        .number-restart {

            display: none;

            width: 100%;

            margin-top: 12px;

            padding: 15px;

            border: 1px solid #333;

            border-radius: 10px;

            background: transparent;

            color: white;

            font-weight: bold;

            cursor: pointer;

        }


        .number-share {

            display: none;

            width: 100%;

            margin-top: 10px;

            padding: 15px;

            border: 1px solid #333;

            border-radius: 10px;

            background: transparent;

            color: white;

            font-weight: bold;

            cursor: pointer;

        }


        .number-achievement {

            display: none;

            margin-top: 15px;

            padding: 14px;

            border-radius: 12px;

            background: #151518;

            border: 1px solid #29292d;

            font-size: 14px;

        }

    </style>

</head>


<body>


<header class="header">

    <a
        href="../index.html"
        class="logo"
    >
        CAOS<span>LAB</span>
    </a>

</header>



<main class="number-page">

    <div class="number-container">


        <a
            href="../index.html"
            class="number-back"
        >
            ← Volver a CAOSLAB
        </a>


        <div class="number-icon">
            🔢
        </div>


        <h1>
            Adivina el Número
        </h1>


        <p class="number-subtitle">
            Estoy pensando en un número del 1 al 100.
        </p>



        <input
            id="numberInput"
            class="number-input"
            type="number"
            min="1"
            max="100"
            inputmode="numeric"
            placeholder="Escribe un número"
        >



        <button
            id="checkButton"
            class="number-button"
            type="button"
        >
            COMPROBAR
        </button>



        <div
            id="result"
            class="number-result"
        >
            ¿Podrás encontrarlo?
        </div>



        <div class="number-attempts">

            Intentos:

            <span id="attempts">
                0
            </span>

        </div>



        <div class="number-score">

            Puntos de esta partida:

            <strong id="currentScore">
                0
            </strong>

        </div>



        <div class="number-record">

            Mejor puntuación:

            <strong id="bestScore">
                0
            </strong>

        </div>



        <button
            id="restartButton"
            class="number-restart"
            type="button"
        >
            JUGAR DE NUEVO
        </button>



        <button
            id="shareButton"
            class="number-share"
            type="button"
        >
            📤 COMPARTIR RESULTADO
        </button>



        <div
            id="achievement"
            class="number-achievement"
        ></div>


    </div>

</main>



<script src="../js/stats.js"></script>


<script>

(function () {

    "use strict";


    /* ---------------------------------------------------------
       ELEMENTOS
       --------------------------------------------------------- */

    const input =
        document.getElementById(
            "numberInput"
        );


    const checkButton =
        document.getElementById(
            "checkButton"
        );


    const result =
        document.getElementById(
            "result"
        );


    const attemptsText =
        document.getElementById(
            "attempts"
        );


    const currentScoreText =
        document.getElementById(
            "currentScore"
        );


    const bestScoreText =
        document.getElementById(
            "bestScore"
        );


    const restartButton =
        document.getElementById(
            "restartButton"
        );


    const shareButton =
        document.getElementById(
            "shareButton"
        );


    const achievement =
        document.getElementById(
            "achievement"
        );



    /* ---------------------------------------------------------
       VARIABLES
       --------------------------------------------------------- */

    let secretNumber =
        generateNumber();


    let attempts = 0;

    let gameFinished = false;

    let currentScore = 0;



    /* ---------------------------------------------------------
       NÚMERO ALEATORIO
       --------------------------------------------------------- */

    function generateNumber() {

        return Math.floor(
            Math.random() * 100
        ) + 1;

    }



    /* ---------------------------------------------------------
       PUNTUACIÓN
       --------------------------------------------------------- */

    function calculateScore() {

        const score =
            Math.max(
                10,
                110 - (
                    attempts * 10
                )
            );


        return score;

    }



    /* ---------------------------------------------------------
       ACTUALIZAR MEJOR PUNTUACIÓN
       --------------------------------------------------------- */

    function updateBestScore() {

        if (
            typeof window.CAOSLAB_STATS ===
            "undefined"
        ) {

            return;

        }


        const stats =
            window.CAOSLAB_STATS.get();


        const gameStats =
            stats.games.numero;


        const best =
            gameStats
                ? gameStats.bestScore
                : 0;


        bestScoreText.textContent =
            best;

    }



    /* ---------------------------------------------------------
       COMPROBAR NÚMERO
       --------------------------------------------------------- */

    function checkNumber() {

        if (gameFinished) {

            return;

        }


        const value =
            Number(input.value);


        if (
            !Number.isInteger(value) ||
            value < 1 ||
            value > 100
        ) {

            result.textContent =
                "⚠️ Escribe un número entre 1 y 100.";

            return;

        }


        attempts++;

        attemptsText.textContent =
            attempts;



        if (
            value === secretNumber
        ) {

            finishGame();

            return;

        }



        if (
            value < secretNumber
        ) {

            result.textContent =
                "⬆️ Demasiado bajo. Prueba con un número mayor.";

        }

        else {

            result.textContent =
                "⬇️ Demasiado alto. Prueba con un número menor.";

        }


        input.select();

    }



    /* ---------------------------------------------------------
       FINALIZAR PARTIDA
       --------------------------------------------------------- */

    function finishGame() {

        gameFinished = true;


        currentScore =
            calculateScore();


        currentScoreText.textContent =
            currentScore;


        result.textContent =
            "🎉 ¡ACERTASTE! El número era " +
            secretNumber +
            ". Lo conseguiste en " +
            attempts +
            " intentos.";


        input.disabled = true;

        checkButton.disabled = true;

        restartButton.style.display =
            "block";

        shareButton.style.display =
            "block";



        /* -----------------------------------------------------
           GUARDAR ESTADÍSTICAS
           ----------------------------------------------------- */

        let previousAchievements = [];


        if (
            typeof window.CAOSLAB_STATS !==
            "undefined"
        ) {

            const before =
                window.CAOSLAB_STATS.get();


            previousAchievements =
                [
                    ...before.achievements
                ];


            window.CAOSLAB_STATS.recordGame(
                "numero",
                "win",
                currentScore
            );


            updateBestScore();


            const after =
                window.CAOSLAB_STATS.get();


            showNewAchievements(
                previousAchievements,
                after.achievements
            );

        }

    }



    /* ---------------------------------------------------------
       LOGROS NUEVOS
       --------------------------------------------------------- */

    function showNewAchievements(
        before,
        after
    ) {

        const newAchievements =
            after.achievements.filter(
                function (id) {

                    return !before.includes(id);

                }
            );


        if (
            newAchievements.length === 0
        ) {

            return;

        }


        const names = {

            first_game:
                "🎮 Primera partida",

            ten_games:
                "🔥 10 partidas",

            first_win:
                "🏆 Primera victoria",

            five_wins:
                "🏆 5 victorias",

            hundred_points:
                "⭐ 100 puntos",

            five_hundred_points:
                "💎 500 puntos"

        };


        achievement.textContent =
            "🏅 ¡NUEVO LOGRO! " +
            newAchievements
                .map(
                    function (id) {

                        return (
                            names[id] ||
                            id
                        );

                    }
                )
                .join(" · ");


        achievement.style.display =
            "block";

    }



    /* ---------------------------------------------------------
       COMPARTIR
       --------------------------------------------------------- */

    function shareResult() {

        const message =
            "🔢 He jugado a Adivina el Número en CAOSLAB y he conseguido " +
            currentScore +
            " puntos en " +
            attempts +
            " intentos. 🧪";


        if (
            navigator.share
        ) {

            navigator.share({

                title:
                    "CAOSLAB — Adivina el Número",

                text:
                    message

            }).catch(
                function () {

                    /* El usuario canceló */

                }
            );


            return;

        }


        if (
            navigator.clipboard
        ) {

            navigator.clipboard
                .writeText(message)
                .then(
                    function () {

                        shareButton.textContent =
                            "✅ RESULTADO COPIADO";

                    }
                )
                .catch(
                    function () {

                        shareButton.textContent =
                            "📋 COPIA EL RESULTADO";

                    }
                );

        }

    }



    /* ---------------------------------------------------------
       REINICIAR
       --------------------------------------------------------- */

    function restartGame() {

        secretNumber =
            generateNumber();


        attempts = 0;

        gameFinished = false;

        currentScore = 0;


        attemptsText.textContent =
            "0";


        currentScoreText.textContent =
            "0";


        result.textContent =
            "¿Podrás encontrarlo?";


        input.value = "";

        input.disabled = false;


        checkButton.disabled =
            false;


        restartButton.style.display =
            "none";


        shareButton.style.display =
            "none";


        achievement.style.display =
            "none";


        shareButton.textContent =
            "📤 COMPARTIR RESULTADO";


        updateBestScore();


        input.focus();

    }



    /* ---------------------------------------------------------
       EVENTOS
       --------------------------------------------------------- */

    checkButton.addEventListener(
        "click",
        checkNumber
    );


    restartButton.addEventListener(
        "click",
        restartGame
    );


    shareButton.addEventListener(
        "click",
        shareResult
    );


    input.addEventListener(
        "keydown",
        function (event) {

            if (
                event.key === "Enter"
            ) {

                checkNumber();

            }

        }
    );



    /* ---------------------------------------------------------
       INICIO
       --------------------------------------------------------- */

    updateBestScore();


})();

</script>


</body>

</html>
