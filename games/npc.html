<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="CAOSLAB — Generador de NPC"
    >

    <meta
        name="theme-color"
        content="#0b0b0d"
    >

    <title>
        Generador de NPC — CAOSLAB
    </title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <style>

        .npc-result {
            width: 100%;
            max-width: 700px;
            margin: 25px auto;
            padding: 22px;
            box-sizing: border-box;
            background: #18181c;
            border: 1px solid #29292d;
            border-radius: 18px;
        }

        .npc-name {
            margin-bottom: 20px;
            color: white;
            font-size: 28px;
            font-weight: 900;
            text-align: center;
        }

        .npc-info {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 9px;
        }

        .npc-row {
            min-width: 0;
            padding: 13px;
            box-sizing: border-box;
            background: #111114;
            border: 1px solid #252529;
            border-radius: 11px;
        }

        .npc-label {
            margin-bottom: 5px;
            color: #666;
            font-size: 8px;
            font-weight: 900;
            letter-spacing: 0.8px;
        }

        .npc-value {
            color: #eee;
            font-size: 12px;
            font-weight: 800;
            line-height: 1.4;
            overflow-wrap: anywhere;
        }

        .npc-danger {
            margin-top: 12px;
            padding: 15px;
            box-sizing: border-box;
            background: #111114;
            border: 1px solid #29292d;
            border-radius: 12px;
            text-align: center;
        }

        .npc-danger-label {
            color: #666;
            font-size: 8px;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .npc-danger-value {
            margin-top: 5px;
            color: white;
            font-size: 15px;
            font-weight: 900;
            line-height: 1.4;
        }

        .npc-points {
            margin-top: 10px;
            color: #999;
            font-size: 11px;
            font-weight: 900;
            text-align: center;
        }

        .npc-empty {
            padding: 35px 20px;
            color: #666;
            font-size: 13px;
            font-weight: 700;
            text-align: center;
        }

        @media (max-width: 600px) {

            .npc-result {
                padding: 16px;
            }

            .npc-name {
                font-size: 23px;
            }

            .npc-info {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         CABECERA
         ===================================================== -->

    <header class="hero">

        <div class="hero-content">

            <div class="hero-badge">
                CAOSLAB V1.3
            </div>

            <h1>
                GENERADOR DE NPC
            </h1>

            <p>
                Crea personajes que probablemente no deberían existir.
            </p>

        </div>

    </header>


    <!-- =====================================================
         JUEGO
         ===================================================== -->

    <main class="container">


        <section class="game-panel">


            <div class="game-result">

                <div class="result-title">
                    🎭 GENERADOR DE PERSONAJES
                </div>

                <p class="result-text">
                    Pulsa el botón y deja que el caos cree un NPC.
                </p>

            </div>


            <!-- =================================================
                 RESULTADO
                 ================================================= -->

            <div
                id="npcResult"
                class="npc-result"
            >

                <div class="npc-empty">
                    Tu próximo NPC está esperando…
                </div>

            </div>


            <!-- =================================================
                 BOTÓN
                 ================================================= -->

            <button
                type="button"
                id="generateButton"
                class="game-button"
            >
                🎲 GENERAR NPC
            </button>


            <!-- =================================================
                 MARCADOR
                 ================================================= -->

            <div
                class="score-board"
                style="margin-top:20px;"
            >

                <div class="score-item">

                    <span>
                        NPC GENERADOS
                    </span>

                    <strong id="plays">
                        0
                    </strong>

                </div>


                <div class="score-item">

                    <span>
                        PUNTOS
                    </span>

                    <strong id="sessionPoints">
                        0
                    </strong>

                </div>

            </div>


            <!-- =================================================
                 ACCIONES
                 ================================================= -->

            <div
                class="game-actions"
                style="margin-top:20px;"
            >

                <button
                    type="button"
                    id="shareButton"
                    class="secondary-button"
                >
                    📤 COMPARTIR
                </button>


                <a
                    href="../index.html"
                    class="stats-button"
                >
                    ← VOLVER A CAOSLAB
                </a>

            </div>


        </section>


        <!-- =================================================
             PUBLICIDAD
             ================================================= -->

        <section class="ad-container">

            <div class="ad-placeholder">

                <span>
                    ESPACIO PUBLICITARIO
                </span>

            </div>

        </section>


    </main>


    <!-- =====================================================
         PIE
         ===================================================== -->

    <footer class="footer">

        <div class="footer-links">

            <a href="../privacy.html">
                Privacidad
            </a>

            <a href="../cookies.html">
                Cookies
            </a>

            <a href="../terms.html">
                Términos
            </a>

        </div>


        <p>

            ©
            <span id="year"></span>
            CAOSLAB

        </p>

    </footer>

         ESTADÍSTICAS

            /* =================================================
               ALEATORIO
               ================================================= */

            function randomItem(array) {

                return array[
                    Math.floor(
                        Math.random() *
                        array.length
                    )
                ];

            }


            /* =================================================
               ESCAPAR HTML
               ================================================= */

            function escapeHTML(value) {

                return String(value)
                    .replace(
                        /&/g,
                        "&amp;"
                    )
                    .replace(
                        /</g,
                        "&lt;"
                    )
                    .replace(
                        />/g,
                        "&gt;"
                    )
                    .replace(
                        /"/g,
                        "&quot;"
                    )
                    .replace(
                        /'/g,
                        "&#039;"
                    );

            }


            /* =================================================
               GENERAR NPC
               ================================================= */

            function generateNPC() {

                const name =
                    randomItem(names);


                const surname =
                    randomItem(surnames);


                const profession =
                    randomItem(professions);


                const personality =
                    randomItem(personalities);


                const skill =
                    randomItem(skills);


                const secret =
                    randomItem(secrets);


                const phrase =
                    randomItem(phrases);


                const danger =
                    randomItem(dangers);


                const npc = {

                    name:
                        name +
                        " " +
                        surname,

                    profession:
                        profession,

                    personality:
                        personality,

                    skill:
                        skill,

                    secret:
                        secret,

                    phrase:
                        phrase,

                    danger:
                        danger.text,

                    points:
                        danger.points

                };

                sessionPoints +=
                    npc.points;

                    sessionPlays;

                    sessionPoints;

                            <div class="npc-label">

                            <div class="npc-value">

                            </div>

                        </div>


                        <div class="npc-row">

                            <div class="npc-label">

                        <div class="npc-danger-label">

                    </div>

                        <div class="npc-danger-value">
                            ${escapeHTML(npc.danger)}
                        </div>

                    </div>


                    <div class="npc-points">
                        +${npc.points} PUNTOS

                 * una partida independiente.
