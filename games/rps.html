<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Piedra Papel Tijera — CAOSLAB</title>

<link
rel="stylesheet"
href="../css/style.css"
>

<style>

.game-page {

    min-height: calc(100vh - 70px);

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 30px 20px;

    text-align: center;

}

.game-container {

    width: 100%;

    max-width: 650px;

}

.back {

    display: inline-block;

    margin-bottom: 25px;

    color: #777;

}

.choices {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 12px;

    margin: 30px 0;

}

.choice {

    padding: 25px 10px;

    border-radius: 15px;

    border: 1px solid #29292d;

    background: #151518;

    color: white;

    font-size: 40px;

    cursor: pointer;

}

.choice:hover {

    background: #222;

}

.result {

    min-height: 120px;

    padding: 30px;

    background: #151518;

    border-radius: 15px;

    border: 1px solid #29292d;

    font-weight: bold;

}

</style>

</head>

<body>

<header class="header">

<a
href="../index.html"
class="logo"
>
CAOS<span>LAB</span>
</a>

</header>


<main class="game-page">

<div class="game-container">

<a
href="../index.html"
class="back"
>
← Volver
</a>

<h1>
✊ Piedra, Papel o Tijera
</h1>

<p>
Elige tu arma.
</p>


<div class="choices">

<button
class="choice"
data-choice="piedra"
>
✊
</button>

<button
class="choice"
data-choice="papel"
>
✋
</button>

<button
class="choice"
data-choice="tijera"
>
✌️
</button>

</div>


<div
id="result"
class="result"
>
Esperando tu elección...
</div>

</div>

</main>


<script>

const choices =
[
    "piedra",
    "papel",
    "tijera"
];


const icons =
{
    piedra: "✊",
    papel: "✋",
    tijera: "✌️"
};


const result =
document.getElementById("result");


document
.querySelectorAll(".choice")
.forEach(button => {

    button.addEventListener("click", () => {

        const player =
            button.dataset.choice;


        const computer =
            choices[
                Math.floor(
                    Math.random() * 3
                )
            ];


        let message;


        if (player === computer) {

            message =
                "🤝 EMPATE";

        }

        else if (

            (player === "piedra" &&
             computer === "tijera") ||

            (player === "papel" &&
             computer === "piedra") ||

            (player === "tijera" &&
             computer === "papel")

        ) {

            message =
                "🏆 ¡HAS GANADO!";

        }

        else {

            message =
                "💀 HAS PERDIDO";

        }


        result.innerHTML =

            `${icons[player]} Tú
            <br>
            VS
            <br>
            ${icons[computer]} CAOS
            <br><br>
            ${message}`;

    });

});

</script>

</body>

</html>
