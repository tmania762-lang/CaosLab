<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Oráculo del Caos — CAOSLAB</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <style>

        .oracle-page {

            min-height:
                calc(100vh - 70px);

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 30px 20px;

            text-align: center;

        }


        .oracle-container {

            width: 100%;

            max-width: 650px;

        }


        .oracle-back {

            display: inline-block;

            margin-bottom: 30px;

            color: #777;

        }


        .oracle-back:hover {

            color: white;

        }


        .oracle-icon {

            font-size: 70px;

            margin-bottom: 10px;

        }


        .oracle-container h1 {

            font-size:
                clamp(35px, 8vw, 60px);

            margin-bottom: 10px;

        }


        .oracle-subtitle {

            color: #777;

            margin-bottom: 30px;

        }


        .oracle-input {

            width: 100%;

            box-sizing: border-box;

            padding: 18px;

            border: 1px solid #333;

            border-radius: 10px;

            background: #151518;

            color: white;

            font-size: 16px;

            text-align: center;

            outline: none;

        }


        .oracle-input:focus {

            border-color: #555;

        }


        .oracle-button {

            width: 100%;

            margin-top: 12px;

            padding: 18px;

            border: none;

            border-radius: 10px;

            background: white;

            color: black;

            font-size: 17px;

            font-weight: 900;

            cursor: pointer;

        }


        .oracle-button:active {

            transform: scale(0.98);

        }


        .oracle-result {

            min-height: 180px;

            margin-top: 25px;

            padding: 30px;

            box-sizing: border-box;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            background: #151518;

            border: 1px solid #29292d;

            border-radius: 18px;

        }


        .oracle-result-icon {

            font-size: 40px;

            margin-bottom: 12px;

        }


        .oracle-result-text {

            font-size:
                clamp(21px, 5vw, 30px);

            line-height: 1.4;

            font-weight: 900;

        }


        .oracle-result-detail {

            margin-top: 12px;

            color: #777;

            font-size: 13px;

        }


        .oracle-score {

            margin-top: 20px;

            color: #777;

            font-size: 14px;

        }


        .oracle-score strong {

            color: white;

            font-size: 25px;

        }


        .oracle-record {

            margin-top: 8px;

            color: #555;

            font-size: 12px;

        }


        .oracle-copy,

        .oracle-share {

            width: 100%;

            margin-top: 12px;

            padding: 15px;

            border: 1px solid #333;

            border-radius: 10px;

            background: transparent;

            color: white;

            font-weight: bold;

            cursor: pointer;

        }


        .oracle-history {

            margin-top: 25px;

            padding: 20px;

            background: #111114;

            border: 1px solid #29292d;

            border-radius: 15px;

            text-align: left;

        }


        .oracle-history-title {

            margin-bottom: 12px;

            font-size: 13px;

            font-weight: 900;

            letter-spacing: 1px;

        }


        .oracle-history-list {

            display: flex;

            flex-direction: column;

            gap: 8px;

        }


        .oracle-history-item {

            padding: 10px;

            border-radius: 8px;

            background: #18181c;

            color: #aaa;

            font-size: 12px;

        }


        @media (max-width: 500px) {

            .oracle-result {

                padding: 22px;

            }

        }

    </style>

</head>


<body>


<header class="header">

    <a
        href="../index.html"
        class="logo"
    >
        CAOS<span>LAB</span>
    </a>

</header>



<main class="oracle-page">

    <div class="oracle-container">


        <a
            href="../index.html"
            class="oracle-back"
        >
            ← Volver a CAOSLAB
        </a>


        <div class="oracle-icon">
            🔮
        </div>


        <h1>
            Oráculo del Caos
        </h1>


        <p class="oracle-subtitle">

            Haz una pregunta.

            <br>

            El oráculo decidirá tu destino.

        </p>



        <input
            id="questionInput"
            class="oracle-input"
            type="text"
            maxlength="150"
            placeholder="¿Debería hacerlo?"
            autocomplete="off"
        >



        <button
            id="askButton"
            class="oracle-button"
            type="button"
        >
            🔮 CONSULTAR AL ORÁCULO
        </button>



        <div class="oracle-result">

            <div
                id="resultIcon"
                class="oracle-result-icon"
            >
                🔮
            </div>


            <div
                id="resultText"
                class="oracle-result-text"
            >
                El oráculo está dormido...
            </div>


            <div
                id="resultDetail"
                class="oracle-result-detail"
            >
                Haz una pregunta para despertarlo.

            </div>

        </div>



        <div class="oracle-score">

            Puntos:

            <strong id="currentScore">
                0
            </strong>

        </div>



        <div class="oracle-record">

            Mejor puntuación:

            <strong id="bestScore">
                0
            </strong>

        </div>



        <button
            id="copyButton"
            class="oracle-copy"
            type="button"
        >
            📋 COPIAR RESPUESTA
        </button>



        <button
            id="shareButton"
            class="oracle-share"
            type="button"
        >
            📤 COMPARTIR RESPUESTA
        </button>



        <div class="oracle-history">

            <div class="oracle-history-title">
                📜 ÚLTIMAS RESPUESTAS
            </div>


            <div
                id="historyList"
                class="oracle-history-list"
            >

                <div class="oracle-history-item">
                    Todavía no has consultado al oráculo.
                </div>

            </div>

        </div>


    </div>

</main>



<script src="../js/stats.js"></script>


<script>

(function () {

    "use strict";


    /* ---------------------------------------------------------
       ELEMENTOS
       --------------------------------------------------------- */

    const questionInput =
        document.getElementById(
            "questionInput"
        );


    const askButton =
        document.getElementById(
            "askButton"
        );


    const resultIcon =
        document.getElementById(
            "resultIcon"
        );


    const resultText =
        document.getElementById(
            "resultText"
        );


    const resultDetail =
        document.getElementById(
            "resultDetail"
        );


    const currentScoreText =
        document.getElementById(
            "currentScore"
        );


    const bestScoreText =
        document.getElementById(
            "bestScore"
        );


    const copyButton =
        document.getElementById(
            "copyButton"
        );


    const shareButton =
        document.getElementById(
            "shareButton"
        );


    const historyList =
        document.getElementById(
            "historyList"
        );



    /* ---------------------------------------------------------
       RESPUESTAS
       --------------------------------------------------------- */

    const answers = [

        {
            icon: "✅",
            text: "SÍ.",
            detail: "El caos considera que debes hacerlo.",
            points: 100
        },

        {
            icon: "❌",
            text: "NO.",
            detail: "El oráculo ha hablado. No insistas.",
            points: 80
        },

        {
            icon: "🤔",
            text: "PROBABLEMENTE.",
            detail: "Pero nadie puede garantizar nada.",
            points: 60
        },

        {
            icon: "🔥",
            text: "ABSOLUTAMENTE SÍ.",
            detail: "¿Qué podría salir mal?",
            points: 150
        },

        {
            icon: "💀",
            text: "NI SE TE OCURRA.",
            detail: "El oráculo ha visto el futuro y no le gusta.",
            points: 120
        },

        {
            icon: "🌀",
            text: "EL CAOS NO LO SABE.",
            detail: "Incluso el caos necesita un momento para pensar.",
            points: 50
        },

        {
            icon: "🎲",
            text: "LANZA UNA MONEDA.",
            detail: "El oráculo delega esta decisión.",
            points: 75
        },

        {
            icon: "👽",
            text: "PREGUNTA A UN EXTRATERRESTRE.",
            detail: "Ellos probablemente saben algo que tú no.",
            points: 90
        },

        {
            icon: "😂",
            text: "JAJAJA... NO.",
            detail: "La pregunta ya era sospechosa.",
            points: 110
        },

        {
            icon: "🧪",
            text: "HAZLO COMO EXPERIMENTO.",
            detail: "Si sale mal, siempre puedes llamarlo ciencia.",
            points: 130
        },

        {
            icon: "⏳",
            text: "ESPERA.",
            detail: "El momento todavía no ha llegado.",
            points: 70
        },

        {
            icon: "🏆",
            text: "EL DESTINO DICE QUE SÍ.",
            detail: "Hoy parece que tienes suerte.",
            points: 200
        }

    ];



    /* ---------------------------------------------------------
       VARIABLES
       --------------------------------------------------------- */

    let currentScore = 0;

    let currentQuestion = "";

    let currentAnswer = null;



    /* ---------------------------------------------------------
       RÉCORD
       --------------------------------------------------------- */

    function updateBestScore() {

        if (
            typeof window.CAOSLAB_STATS ===
            "undefined"
        ) {

            return;

        }


        const stats =
            window.CAOSLAB_STATS.get();


        const gameStats =
            stats.games.oraculo;


        if (gameStats) {

            bestScoreText.textContent =
                gameStats.bestScore;

        }

    }



    /* ---------------------------------------------------------
       CONSULTAR
       --------------------------------------------------------- */

    function askOracle() {

        const question =
            questionInput.value.trim();


        if (!question) {

            resultIcon.textContent =
                "⚠️";

            resultText.textContent =
                "HAZ UNA PREGUNTA.";

            resultDetail.textContent =
                "El oráculo no puede responder al silencio.";

            return;

        }


        currentQuestion =
            question;


        const index =
            Math.floor(
                Math.random() *
                answers.length
            );


        currentAnswer =
            answers[index];


        currentScore =
            currentAnswer.points;


        resultIcon.textContent =
            currentAnswer.icon;


        resultText.textContent =
            currentAnswer.text;


        resultDetail.textContent =
            currentAnswer.detail;


        currentScoreText.textContent =
            currentScore;


        addToHistory(
            question,
            currentAnswer
        );


        /* ---------------------------------------------
           ESTADÍSTICAS
           --------------------------------------------- */

        if (
            typeof window.CAOSLAB_STATS !==
            "undefined"
        ) {

            window.CAOSLAB_STATS.recordGame(

                "oraculo",

                "win",

                currentScore

            );


            updateBestScore();

        }


        copyButton.textContent =
            "📋 COPIAR RESPUESTA";


        shareButton.textContent =
            "📤 COMPARTIR RESPUESTA";

    }



    /* ---------------------------------------------------------
       HISTORIAL
       --------------------------------------------------------- */

    function addToHistory(
        question,
        answer
    ) {

        if (
            historyList.children.length === 1 &&
            historyList.children[0]
                .textContent.includes(
                    "Todavía no has"
                )
        ) {

            historyList.innerHTML = "";

        }


        const item =
            document.createElement(
                "div"
            );


        item.className =
            "oracle-history-item";


        item.textContent =

            "❓ " +
            question +
            " → " +
            answer.icon +
            " " +
            answer.text;


        historyList.insertBefore(

            item,

            historyList.firstChild

        );


        while (
            historyList.children.length > 5
        ) {

            historyList.removeChild(
                historyList.lastChild
            );

        }

    }



    /* ---------------------------------------------------------
       TEXTO PARA COMPARTIR
       --------------------------------------------------------- */

    function getShareText() {

        return (

            "🔮 Oráculo del Caos — CAOSLAB 🧪\n\n" +

            "❓ " +
            currentQuestion +
            "\n\n" +

            currentAnswer.icon +
            " " +
            currentAnswer.text +
            "\n" +

            currentAnswer.detail +
            "\n\n" +

            "Puntos: " +
            currentScore

        );

    }



    /* ---------------------------------------------------------
       COPIAR
       --------------------------------------------------------- */

    function copyAnswer() {

        if (!currentAnswer) {

            resultDetail.textContent =
                "Primero consulta al oráculo.";

            return;

        }


        const text =
            getShareText();


        if (
            navigator.clipboard
        ) {

            navigator.clipboard
                .writeText(text)
                .then(

                    function () {

                        copyButton.textContent =
                            "✅ RESPUESTA COPIADA";

                    }

                )
                .catch(

                    function () {

                        copyButton.textContent =
                            "📋 COPIA EL RESULTADO";

                    }

                );

        }

    }



    /* ---------------------------------------------------------
       COMPARTIR
       --------------------------------------------------------- */

    function shareAnswer() {

        if (!currentAnswer) {

            resultDetail.textContent =
                "Primero consulta al oráculo.";

            return;

        }


        const text =
            getShareText();


        if (
            navigator.share
        ) {

            navigator.share({

                title:
                    "CAOSLAB — Oráculo del Caos",

                text:
                    text

            }).catch(
                function () {}
            );


            return;

        }


        if (
            navigator.clipboard
        ) {

            navigator.clipboard
                .writeText(text)
                .then(

                    function () {

                        shareButton.textContent =
                            "✅ RESULTADO COPIADO";

                    }

                )
                .catch(

                    function () {

                        shareButton.textContent =
                            "📋 COPIA EL RESULTADO";

                    }

                );

        }

    }



    /* ---------------------------------------------------------
       EVENTOS
       --------------------------------------------------------- */

    askButton.addEventListener(

        "click",

        askOracle

    );


    questionInput.addEventListener(

        "keydown",

        function (event) {

            if (
                event.key === "Enter"
            ) {

                askOracle();

            }

        }

    );


    copyButton.addEventListener(

        "click",

        copyAnswer

    );


    shareButton.addEventListener(

        "click",

        shareAnswer

    );



    /* ---------------------------------------------------------
       INICIO
       --------------------------------------------------------- */

    updateBestScore();


})();

</script>


</body>

</html>
