<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Ruleta del Caos — CAOSLAB</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <style>

        .roulette-page {

            min-height:
                calc(100vh - 70px);

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 30px 20px;

            text-align: center;

        }


        .roulette-container {

            width: 100%;

            max-width: 650px;

        }


        .roulette-back {

            display: inline-block;

            margin-bottom: 30px;

            color: #777;

        }


        .roulette-back:hover {

            color: white;

        }


        .roulette-icon {

            font-size: 60px;

            margin-bottom: 10px;

        }


        .roulette-container h1 {

            font-size:
                clamp(35px, 8vw, 60px);

            margin-bottom: 10px;

        }


        .roulette-subtitle {

            color: #777;

            margin-bottom: 30px;

        }


        .roulette-wheel {

            width: 230px;

            height: 230px;

            margin: 0 auto 25px;

            border-radius: 50%;

            border: 8px solid #29292d;

            background: #151518;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 75px;

            box-shadow:
                0 0 0 5px #111114;

            transition:
                transform 1s cubic-bezier(.17,.67,.12,1);

        }


        .roulette-wheel.spin {

            transform:
                rotate(1080deg);

        }


        .roulette-button {

            width: 100%;

            padding: 18px;

            border: none;

            border-radius: 10px;

            background: white;

            color: black;

            font-size: 17px;

            font-weight: 900;

            cursor: pointer;

        }


        .roulette-button:disabled {

            opacity: 0.5;

            cursor: not-allowed;

        }


        .roulette-result {

            min-height: 120px;

            margin-top: 25px;

            padding: 25px;

            box-sizing: border-box;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            background: #151518;

            border: 1px solid #29292d;

            border-radius: 15px;

        }


        .roulette-result-main {

            font-size: 24px;

            font-weight: 900;

        }


        .roulette-result-detail {

            margin-top: 8px;

            color: #777;

            font-size: 14px;

        }


        .roulette-score {

            margin-top: 18px;

            color: #777;

            font-size: 14px;

        }


        .roulette-score strong {

            color: white;

            font-size: 25px;

        }


        .roulette-record {

            margin-top: 8px;

            color: #555;

            font-size: 12px;

        }


        .roulette-share {

            display: none;

            width: 100%;

            margin-top: 12px;

            padding: 15px;

            border: 1px solid #333;

            border-radius: 10px;

            background: transparent;

            color: white;

            font-weight: bold;

            cursor: pointer;

        }


        .roulette-reset {

            width: 100%;

            margin-top: 10px;

            padding: 15px;

            border: 1px solid #333;

            border-radius: 10px;

            background: transparent;

            color: white;

            font-weight: bold;

            cursor: pointer;

        }


        @media (max-width: 500px) {

            .roulette-wheel {

                width: 190px;

                height: 190px;

                font-size: 60px;

            }

        }

    </style>

</head>


<body>


<header class="header">

    <a
        href="../index.html"
        class="logo"
    >
        CAOS<span>LAB</span>
    </a>

</header>



<main class="roulette-page">

    <div class="roulette-container">


        <a
            href="../index.html"
            class="roulette-back"
        >
            ← Volver a CAOSLAB
        </a>


        <div class="roulette-icon">
            🎰
        </div>


        <h1>
            Ruleta del Caos
        </h1>


        <p class="roulette-subtitle">
            Gira la ruleta y acepta tu destino.
        </p>



        <div
            id="wheel"
            class="roulette-wheel"
        >
            🎰
        </div>



        <button
            id="spinButton"
            class="roulette-button"
            type="button"
        >
            🎰 GIRAR RULETA
        </button>



        <div class="roulette-result">

            <div
                id="resultMain"
                class="roulette-result-main"
            >
                ¿QUÉ TE TOCARÁ?
            </div>


            <div
                id="resultDetail"
                class="roulette-result-detail"
            >
                El caos está esperando...
            </div>

        </div>



        <div class="roulette-score">

            Puntos:

            <strong id="currentScore">
                0
            </strong>

        </div>



        <div class="roulette-record">

            Mejor puntuación:

            <strong id="bestScore">
                0
            </strong>

        </div>



        <button
            id="shareButton"
            class="roulette-share"
            type="button"
        >
            📤 COMPARTIR RESULTADO
        </button>



        <button
            id="resetButton"
            class="roulette-reset"
            type="button"
        >
            🔄 REINICIAR

        </button>


    </div>

</main>



<script src="../js/stats.js"></script>


<script>

(function () {

    "use strict";


    /* ---------------------------------------------------------
       ELEMENTOS
       --------------------------------------------------------- */

    const wheel =
        document.getElementById(
            "wheel"
        );


    const spinButton =
        document.getElementById(
            "spinButton"
        );


    const resultMain =
        document.getElementById(
            "resultMain"
        );


    const resultDetail =
        document.getElementById(
            "resultDetail"
        );


    const currentScoreText =
        document.getElementById(
            "currentScore"
        );


    const bestScoreText =
        document.getElementById(
            "bestScore"
        );


    const shareButton =
        document.getElementById(
            "shareButton"
        );


    const resetButton =
        document.getElementById(
            "resetButton"
        );



    /* ---------------------------------------------------------
       PREMIOS
       --------------------------------------------------------- */

    const results = [

        {
            title: "🍀 ¡HAS TENIDO SUERTE!",
            detail: "El caos te ha perdonado.",
            points: 100
        },

        {
            title: "💀 ¡CAOS ABSOLUTO!",
            detail: "No preguntes por qué.",
            points: 25
        },

        {
            title: "🔥 ¡MODO BESTIA!",
            detail: "Hoy nada puede detenerte.",
            points: 150
        },

        {
            title: "😂 ¡QUÉ RIDÍCULO!",
            detail: "Ni el laboratorio sabe qué ha pasado.",
            points: 50
        },

        {
            title: "🧪 EXPERIMENTO EXITOSO",
            detail: "Contra todo pronóstico.",
            points: 120
        },

        {
            title: "👽 RESULTADO EXTRAÑO",
            detail: "Esto no estaba previsto.",
            points: 75
        },

        {
            title: "🎲 EL DESTINO DECIDE",
            detail: "No puedes escapar del caos.",
            points: 90
        },

        {
            title: "💩 MENUDO RESULTADO",
            detail: "Podría haber sido peor.",
            points: 10
        }

    ];



    /* ---------------------------------------------------------
       VARIABLES
       --------------------------------------------------------- */

    let currentScore = 0;

    let spinning = false;

    let lastResult = null;



    /* ---------------------------------------------------------
       RÉCORD
       --------------------------------------------------------- */

    function updateBestScore() {

        if (
            typeof window.CAOSLAB_STATS ===
            "undefined"
        ) {

            return;

        }


        const stats =
            window.CAOSLAB_STATS.get();


        const gameStats =
            stats.games.ruleta;


        if (gameStats) {

            bestScoreText.textContent =
                gameStats.bestScore;

        }

    }



    /* ---------------------------------------------------------
       GIRAR
       --------------------------------------------------------- */

    function spin() {

        if (spinning) {

            return;

        }


        spinning = true;


        spinButton.disabled =
            true;


        resultMain.textContent =
            "🌀 GIRANDO...";


        resultDetail.textContent =
            "El caos está decidiendo tu destino.";


        shareButton.style.display =
            "none";


        wheel.classList.remove(
            "spin"
        );


        /* Reiniciar animación */

        void wheel.offsetWidth;


        wheel.classList.add(
            "spin"
        );


        const index =
            Math.floor(
                Math.random() *
                results.length
            );


        const selected =
            results[index];


        lastResult =
            selected;


        setTimeout(

            function () {

                currentScore =
                    selected.points;


                currentScoreText.textContent =
                    currentScore;


                resultMain.textContent =
                    selected.title;


                resultDetail.textContent =
                    selected.detail;


                /* ---------------------------------------------
                   ESTADÍSTICAS
                   --------------------------------------------- */

                if (
                    typeof window.CAOSLAB_STATS !==
                    "undefined"
                ) {

                    window.CAOSLAB_STATS.recordGame(

                        "ruleta",

                        "win",

                        currentScore

                    );


                    updateBestScore();

                }


                shareButton.style.display =
                    "block";


                spinButton.disabled =
                    false;


                spinning = false;

            },

            1000

        );

    }



    /* ---------------------------------------------------------
       COMPARTIR
       --------------------------------------------------------- */

    function shareResult() {

        if (!lastResult) {

            return;

        }


        const text =

            "🎰 Ruleta del Caos — CAOSLAB 🧪\n\n" +

            lastResult.title +
            "\n" +

            lastResult.detail +
            "\n\n" +

            "He conseguido " +
            currentScore +
            " puntos.";


        if (
            navigator.share
        ) {

            navigator.share({

                title:
                    "CAOSLAB — Ruleta del Caos",

                text:
                    text

            }).catch(
                function () {}
            );


            return;

        }


        if (
            navigator.clipboard
        ) {

            navigator.clipboard
                .writeText(text)
                .then(

                    function () {

                        shareButton.textContent =
                            "✅ RESULTADO COPIADO";

                    }

                )
                .catch(

                    function () {

                        shareButton.textContent =
                            "📋 COPIA EL RESULTADO";

                    }

                );

        }

    }



    /* ---------------------------------------------------------
       REINICIAR
       --------------------------------------------------------- */

    function resetGame() {

        currentScore = 0;

        spinning = false;

        lastResult = null;


        wheel.classList.remove(
            "spin"
        );


        resultMain.textContent =
            "¿QUÉ TE TOCARÁ?";


        resultDetail.textContent =
            "El caos está esperando...";


        currentScoreText.textContent =
            "0";


        spinButton.disabled =
            false;


        shareButton.style.display =
            "none";


        shareButton.textContent =
            "📤 COMPARTIR RESULTADO";

    }



    /* ---------------------------------------------------------
       EVENTOS
       --------------------------------------------------------- */

    spinButton.addEventListener(
        "click",
        spin
    );


    shareButton.addEventListener(
        "click",
        shareResult
    );


    resetButton.addEventListener(
        "click",
        resetGame
    );



    /* ---------------------------------------------------------
       INICIO
       --------------------------------------------------------- */

    updateBestScore();


})();

</script>


</body>

</html>
