<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="CAOSLAB — Ruleta del Caos"
    >

    <meta
        name="theme-color"
        content="#0b0b0d"
    >

    <title>
        Ruleta del Caos — CAOSLAB
    </title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <style>

        .roulette-wrapper {
            position: relative;
            width: min(320px, 80vw);
            height: min(320px, 80vw);
            margin: 30px auto;
        }

        .roulette-pointer {
            position: absolute;
            top: -12px;
            left: 50%;
            z-index: 5;
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 24px solid white;
            transform: translateX(-50%);
            filter: drop-shadow(0 2px 4px #000);
        }

        .roulette-wheel {
            width: 100%;
            height: 100%;
            overflow: hidden;
            border: 6px solid #29292d;
            border-radius: 50%;
            background:
                conic-gradient(
                    #202024 0deg 45deg,
                    #151518 45deg 90deg,
                    #202024 90deg 135deg,
                    #151518 135deg 180deg,
                    #202024 180deg 225deg,
                    #151518 225deg 270deg,
                    #202024 270deg 315deg,
                    #151518 315deg 360deg
                );
            box-sizing: border-box;
            transition: transform 3.2s cubic-bezier(.12,.75,.15,1);
            box-shadow:
                0 10px 35px rgba(0,0,0,.35),
                inset 0 0 0 4px #0b0b0d;
        }

        .roulette-center {
            position: absolute;
            top: 50%;
            left: 50%;
            z-index: 4;
            width: 58px;
            height: 58px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 4px solid #29292d;
            border-radius: 50%;
            background: #0b0b0d;
            color: white;
            font-size: 11px;
            font-weight: 900;
            transform: translate(-50%, -50%);
            box-shadow: 0 4px 15px rgba(0,0,0,.4);
        }

        .roulette-spin {
            margin-top: 10px;
        }

        .roulette-result {
            min-height: 80px;
        }

        .roulette-result strong {
            display: block;
            margin-bottom: 8px;
            color: white;
            font-size: 18px;
        }

        .roulette-result span {
            color: #aaa;
            font-size: 13px;
        }

        .roulette-points {
            margin-top: 10px;
            color: white;
            font-size: 20px;
            font-weight: 900;
        }

        @media (max-width: 420px) {

            .roulette-wrapper {
                margin-top: 25px;
                margin-bottom: 25px;
            }

            .roulette-center {
                width: 50px;
                height: 50px;
                font-size: 9px;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         CABECERA
         ===================================================== -->

    <header class="hero">

        <div class="hero-content">

            <div class="hero-badge">
                CAOSLAB V1.3
            </div>

            <h1>
                RULETA DEL CAOS
            </h1>

            <p>
                Gira. Confía. Arrepiéntete.
            </p>

        </div>

    </header>


    <!-- =====================================================
         JUEGO
         ===================================================== -->

    <main class="container">

        <section class="game-panel">


            <div
                class="game-result"
                id="result"
            >

                <div class="result-title">
                    ¿QUÉ TE DEPARA EL CAOS?
                </div>

                <p class="result-text">
                    Gira la ruleta para descubrirlo.
                </p>

            </div>


            <div class="roulette-wrapper">

                <div class="roulette-pointer"></div>

                <div
                    class="roulette-wheel"
                    id="wheel"
                ></div>

                <div class="roulette-center">
                    CAOS
                </div>

            </div>


            <button
                type="button"
                id="spinButton"
                class="game-button roulette-spin"
            >
                🎰 GIRAR RULETA
            </button>


            <div
                class="score-board"
                style="margin-top: 25px;"
            >

                <div class="score-item">

                    <span>
                        PARTIDAS
                    </span>

                    <strong id="plays">
                        0
                    </strong>

                </div>


                <div class="score-item">

                    <span>
                        PUNTOS
                    </span>

                    <strong id="sessionPoints">
                        0
                    </strong>

                </div>

            </div>


            <div
                class="game-actions"
                style="margin-top: 20px;"
            >

                <button
                    type="button"
                    id="shareButton"
                    class="secondary-button"
                >
                    📤 COMPARTIR
                </button>

                <a
                    href="../index.html"
                    class="stats-button"
                >
                    ← VOLVER A CAOSLAB
                </a>

            </div>


        </section>


        <!-- =================================================
             PUBLICIDAD
             ================================================= -->

        <section class="ad-container">

            <div class="ad-placeholder">

                <span>
                    ESPACIO PUBLICITARIO
                </span>

            </div>

        </section>

    </main>


    <!-- =====================================================
         PIE
         ===================================================== -->

    <footer class="footer">

        <div class="footer-links">

            <a href="../privacy.html">
                Privacidad
            </a>

            <a href="../cookies.html">
                Cookies
            </a>

            <a href="../terms.html">
                Términos
            </a>

        </div>

        <p>
            ©
            <span id="year"></span>
            CAOSLAB
        </p>

    </footer>


    <!-- =====================================================
         SCRIPTS
         ===================================================== -->

    <script src="../js/stats.js"></script>


    <script>

        (function () {

            "use strict";


            const outcomes = [

                {
                    text: "EL CAOS TE ODIA",
                    points: 10
                },

                {
                    text: "NADA ESPECIAL",
                    points: 25
                },

                {
                    text: "CAOS TOTAL",
                    points: 150
                },

                {
                    text: "HAS HECHO EL RIDÍCULO",
                    points: 50
                },

                {
                    text: "ERES EL ELEGIDO",
                    points: 120
                },

                {
                    text: "EL CAOS TE SONRÍE",
                    points: 75
                },

                {
                    text: "GOLPE DE SUERTE",
                    points: 90
                },

                {
                    text: "EL UNIVERSO PASA DE TI",
                    points: 10
                }

            ];


            const wheel =
                document.getElementById(
                    "wheel"
                );


            const spinButton =
                document.getElementById(
                    "spinButton"
                );


            const result =
                document.getElementById(
                    "result"
                );


            const playsElement =
                document.getElementById(
                    "plays"
                );


            const pointsElement =
                document.getElementById(
                    "sessionPoints"
                );


            const shareButton =
                document.getElementById(
                    "shareButton"
                );


            let isSpinning = false;

            let plays = 0;

            let sessionPoints = 0;

            let lastOutcome = null;


            /* ===============================================
               GIRAR
               =============================================== */

            spinButton.addEventListener(
                "click",
                function () {

                    if (isSpinning) {
                        return;
                    }


                    isSpinning = true;

                    spinButton.disabled = true;

                    spinButton.textContent =
                        "🎰 GIRANDO...";


                    const index =
                        Math.floor(
                            Math.random() *
                            outcomes.length
                        );


                    const outcome =
                        outcomes[index];


                    lastOutcome =
                        outcome;


                    const segment =
                        360 /
                        outcomes.length;


                    const targetAngle =
                        360 -
                        (
                            index * segment +
                            segment / 2
                        );


                    const rotations =
                        5 * 360;


                    const finalAngle =
                        rotations +
                        targetAngle;


                    wheel.style.transform =
                        "rotate(" +
                        finalAngle +
                        "deg)";


                    setTimeout(
                        function () {

                            plays += 1;

                            sessionPoints +=
                                outcome.points;


                            playsElement.textContent =
                                plays;


                            pointsElement.textContent =
                                sessionPoints;


                            result.innerHTML = `

                                <div class="result-title">
                                    RESULTADO
                                </div>

                                <div class="roulette-result">

                                    <strong>
                                        ${outcome.text}
                                    </strong>

                                    <span>
                                        Has conseguido
                                    </span>

                                    <div class="roulette-points">
                                        +${outcome.points} PUNTOS
                                    </div>

                                </div>

                            `;


                            /*
                             * Registrar únicamente
                             * esta tirada.
                             */

                            if (
                                window.CAOSLAB_STATS
                            ) {

                                window.CAOSLAB_STATS.recordGame(
                                    "ruleta",
                                    "play",
                                    outcome.points
                                );

                            }


                            isSpinning = false;

                            spinButton.disabled =
                                false;

                            spinButton.textContent =
                                "🎰 GIRAR RULETA";


                        },
                        3200
                    );

                }
            );


            /* ===============================================
               COMPARTIR
               =============================================== */

            shareButton.addEventListener(
                "click",
                async function () {

                    if (!lastOutcome) {

                        alert(
                            "Primero gira la ruleta."
                        );

                        return;

                    }


                    const text =
                        "En CAOSLAB me ha salido: " +
                        lastOutcome.text +
                        " y he conseguido " +
                        lastOutcome.points +
                        " puntos. 🎰";


                    try {

                        if (
                            navigator.share
                        ) {

                            await navigator.share({
                                title:
                                    "CAOSLAB — Ruleta del Caos",
                                text:
                                    text
                            });

                        }

                        else if (
                            navigator.clipboard
                        ) {

                            await navigator.clipboard.writeText(
                                text
                            );

                            alert(
                                "Resultado copiado al portapapeles."
                            );

                        }

                    } catch (error) {

                        if (
                            error.name !==
                            "AbortError"
                        ) {

                            console.error(
                                "CAOSLAB: error compartiendo",
                                error
                            );

                        }

                    }

                }
            );


            /* ===============================================
               AÑO
               =============================================== */

            const year =
                document.getElementById(
                    "year"
                );


            if (year) {

                year.textContent =
                    new Date().getFullYear();

            }

        })();

    </script>


</body>

</html>
