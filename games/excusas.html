<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Generador de Excusas — CAOSLAB</title>

    <meta
        name="description"
        content="Genera una excusa completamente absurda."
    >

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <style>

        .game-page {
            min-height: calc(100vh - 70px);

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 30px 20px;

            text-align: center;
        }

        .game-container {
            width: 100%;

            max-width: 700px;
        }

        .back {
            display: inline-block;

            margin-bottom: 30px;

            color: #777;
        }

        .back:hover {
            color: white;
        }

        h1 {
            font-size: clamp(40px, 8vw, 70px);

            margin-bottom: 10px;
        }

        .subtitle {
            color: #777;

            margin-bottom: 40px;
        }

        .excuse {

            min-height: 220px;

            padding: 40px 25px;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #151518;

            border: 1px solid #29292d;

            border-radius: 20px;

            font-size: clamp(22px, 5vw, 34px);

            font-weight: 800;

            margin-bottom: 25px;

        }

        button {

            width: 100%;

            padding: 18px;

            border: none;

            border-radius: 12px;

            background: white;

            color: black;

            font-size: 17px;

            font-weight: 900;

            cursor: pointer;

        }

    </style>

</head>

<body>

<header class="header">

    <a href="../index.html" class="logo">
        CAOS<span>LAB</span>
    </a>

</header>


<main class="game-page">

    <div class="game-container">

        <a href="../index.html" class="back">
            ← Volver a CAOSLAB
        </a>

        <h1>
            😂
        </h1>

        <h1>
            Generador de Excusas
        </h1>

        <p class="subtitle">
            Porque siempre hay una explicación.
        </p>


        <div
            id="excuse"
            class="excuse"
        >
            Pulsa el botón para descubrir tu excusa.
        </div>


        <button id="generate">
            GENERAR EXCUSA
        </button>

    </div>

</main>


<script>

const excuses = [

    "Llegué tarde porque mi alarma decidió tomarse el día libre.",

    "No contesté porque estaba teniendo una discusión con mi WiFi.",

    "El tráfico estaba tan mal que hasta los coches estaban haciendo cola para salir.",

    "Mi perro me necesitaba. No quiso explicar por qué.",

    "Iba a hacerlo, pero surgió algo extremadamente importante: tenía hambre.",

    "Mi móvil se quedó sin batería exactamente cuando necesitaba usarlo.",

    "Me entretuve pensando en qué iba a hacer después.",

    "Estaba esperando el momento perfecto. Todavía estoy esperando.",

    "Mi cerebro necesitaba reiniciarse.",

    "La situación se complicó por razones que prefiero no explicar.",

    "Google Maps me dijo una cosa y mi sentido común otra.",

    "Fue culpa del universo.",

    "No llegué tarde. Llegué en horario alternativo.",

    "Estaba ocupado no haciendo nada.",

    "Mi yo del futuro se encargará de eso."

];


const button =
    document.getElementById("generate");

const excuse =
    document.getElementById("excuse");


button.addEventListener("click", () => {

    const random =
        Math.floor(
            Math.random() * excuses.length
        );

    excuse.textContent =
        excuses[random];

});

</script>

</body>

</html>
