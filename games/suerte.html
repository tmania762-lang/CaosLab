<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Test de Suerte — CAOSLAB</title>

<link
rel="stylesheet"
href="../css/style.css"
>

<style>

.game-page {

    min-height: calc(100vh - 70px);

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 30px 20px;

    text-align: center;

}

.game-container {

    width: 100%;

    max-width: 650px;

}

.back {

    color: #777;

    display: inline-block;

    margin-bottom: 30px;

}

.luck {

    font-size: 100px;

    font-weight: 900;

    margin: 30px 0;

}

button {

    width: 100%;

    padding: 18px;

    border: none;

    border-radius: 10px;

    background: white;

    color: black;

    font-weight: 900;

    cursor: pointer;

}

.message {

    min-height: 80px;

    margin-top: 25px;

    color: #aaa;

}

</style>

</head>

<body>

<header class="header">

<a
href="../index.html"
class="logo"
>
CAOS<span>LAB</span>
</a>

</header>


<main class="game-page">

<div class="game-container">

<a
href="../index.html"
class="back"
>
← Volver
</a>

<h1>
🧠 Test de Suerte
</h1>

<p>
Descubre qué dice el caos sobre tu suerte.
</p>


<div
id="luck"
class="luck"
>
?
</div>


<button id="test">
COMPROBAR SUERTE
</button>


<div
id="message"
class="message"
>
</div>

</div>

</main>


<script>

const messages = [

    "Hoy tienes suerte 🍀",

    "La suerte está de tu lado.",

    "Cuidado. Hoy todo puede pasar.",

    "Necesitas encontrar un trébol.",

    "El universo te está mirando.",

    "Suerte nivel legendario 🔥",

    "Suerte sospechosamente alta.",

    "Hoy no apostaría demasiado 😂"

];


document
.getElementById("test")
.addEventListener("click", () => {


    const number =
        Math.floor(
            Math.random() * 101
        );


    const message =
        messages[
            Math.floor(
                Math.random() *
                messages.length
            )
        ];


    document
        .getElementById("luck")
        .textContent =
        number + "%";


    document
        .getElementById("message")
        .textContent =
        message;

});

</script>

</body>

</html>
