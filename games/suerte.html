<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Test de Suerte — CAOSLAB</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <style>

        .luck-page {

            min-height:
                calc(100vh - 70px);

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 30px 20px;

            text-align: center;

        }


        .luck-container {

            width: 100%;

            max-width: 650px;

        }


        .luck-back {

            display: inline-block;

            margin-bottom: 30px;

            color: #777;

        }


        .luck-back:hover {

            color: white;

        }


        .luck-icon {

            font-size: 65px;

            margin-bottom: 10px;

        }


        .luck-container h1 {

            font-size:
                clamp(35px, 8vw, 60px);

            margin-bottom: 10px;

        }


        .luck-subtitle {

            color: #777;

            margin-bottom: 30px;

        }


        .luck-meter {

            position: relative;

            width: 100%;

            height: 22px;

            margin-bottom: 25px;

            overflow: hidden;

            border-radius: 20px;

            background: #151518;

            border: 1px solid #29292d;

        }


        .luck-meter-fill {

            width: 0%;

            height: 100%;

            border-radius: 20px;

            background: white;

            transition:
                width 1s ease;

        }


        .luck-percentage {

            margin-bottom: 25px;

            font-size: 65px;

            font-weight: 900;

        }


        .luck-result {

            min-height: 150px;

            padding: 25px;

            box-sizing: border-box;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            background: #151518;

            border: 1px solid #29292d;

            border-radius: 18px;

        }


        .luck-result-title {

            font-size:
                clamp(21px, 5vw, 30px);

            font-weight: 900;

        }


        .luck-result-detail {

            margin-top: 10px;

            color: #777;

            font-size: 14px;

            line-height: 1.5;

        }


        .luck-button {

            width: 100%;

            margin-top: 20px;

            padding: 18px;

            border: none;

            border-radius: 10px;

            background: white;

            color: black;

            font-size: 17px;

            font-weight: 900;

            cursor: pointer;

        }


        .luck-button:active {

            transform: scale(0.98);

        }


        .luck-button:disabled {

            opacity: 0.5;

            cursor: not-allowed;

        }


        .luck-score {

            margin-top: 20px;

            color: #777;

            font-size: 14px;

        }


        .luck-score strong {

            color: white;

            font-size: 25px;

        }


        .luck-record {

            margin-top: 8px;

            color: #555;

            font-size: 12px;

        }


        .luck-share {

            width: 100%;

            margin-top: 12px;

            padding: 15px;

            border: 1px solid #333;

            border-radius: 10px;

            background: transparent;

            color: white;

            font-weight: bold;

            cursor: pointer;

        }


        @media (max-width: 500px) {

            .luck-percentage {

                font-size: 52px;

            }

        }

    </style>

</head>


<body>


<header class="header">

    <a
        href="../index.html"
        class="logo"
    >
        CAOS<span>LAB</span>
    </a>

</header>



<main class="luck-page">

    <div class="luck-container">


        <a
            href="../index.html"
            class="luck-back"
        >
            ← Volver a CAOSLAB
        </a>


        <div class="luck-icon">
            🧠
        </div>


        <h1>
            Test de Suerte
        </h1>


        <p class="luck-subtitle">

            Descubre cuánto te acompaña la suerte hoy.

        </p>



        <div class="luck-meter">

            <div
                id="meterFill"
                class="luck-meter-fill"
            ></div>

        </div>



        <div
            id="percentage"
            class="luck-percentage"
        >
            ?%

        </div>



        <div class="luck-result">

            <div
                id="resultTitle"
                class="luck-result-title"
            >
                ¿QUÉ TAN AFORTUNADO ERES?
            </div>


            <div
                id="resultDetail"
                class="luck-result-detail"
            >
                Pulsa el botón y deja que el caos decida.

            </div>

        </div>



        <button
            id="testButton"
            class="luck-button"
            type="button"
        >
            🍀 PROBAR MI SUERTE
        </button>



        <div class="luck-score">

            Puntos:

            <strong id="currentScore">
                0
            </strong>

        </div>



        <div class="luck-record">

            Mejor puntuación:

            <strong id="bestScore">
                0
            </strong>

        </div>



        <button
            id="shareButton"
            class="luck-share"
            type="button"
        >
            📤 COMPARTIR RESULTADO
        </button>


    </div>

</main>



<script src="../js/stats.js"></script>


<script>

(function () {

    "use strict";


    /* ---------------------------------------------------------
       ELEMENTOS
       --------------------------------------------------------- */

    const meterFill =
        document.getElementById(
            "meterFill"
        );


    const percentage =
        document.getElementById(
            "percentage"
        );


    const resultTitle =
        document.getElementById(
            "resultTitle"
        );


    const resultDetail =
        document.getElementById(
            "resultDetail"
        );


    const testButton =
        document.getElementById(
            "testButton"
        );


    const currentScoreText =
        document.getElementById(
            "currentScore"
        );


    const bestScoreText =
        document.getElementById(
            "bestScore"
        );


    const shareButton =
        document.getElementById(
            "shareButton"
        );



    /* ---------------------------------------------------------
       VARIABLES
       --------------------------------------------------------- */

    let currentLuck = 0;

    let currentScore = 0;



    /* ---------------------------------------------------------
       RESULTADOS
       --------------------------------------------------------- */

    function getResult(luck) {

        if (luck >= 95) {

            return {

                title:
                    "🍀 ¡SÚPER AFORTUNADO!",

                detail:
                    "Hoy parece que el universo está completamente de tu parte."

            };

        }


        if (luck >= 80) {

            return {

                title:
                    "🔥 ¡MUCHA SUERTE!",

                detail:
                    "Las probabilidades parecen estar sonriendo."

            };

        }


        if (luck >= 65) {

            return {

                title:
                    "😎 BUEN NIVEL DE SUERTE",

                detail:
                    "Puedes intentarlo. Hoy tienes posibilidades."

            };

        }


        if (luck >= 50) {

            return {

                title:
                    "🙂 SUERTE NORMAL",

                detail:
                    "Ni demasiado bien ni demasiado mal."

            };

        }


        if (luck >= 35) {

            return {

                title:
                    "🤔 SUERTE SOSPECHOSA",

                detail:
                    "Quizá sea mejor no arriesgar demasiado."

            };

        }


        if (luck >= 20) {

            return {

                title:
                    "⚠️ POCA SUERTE",

                detail:
                    "Hoy quizá no sea el día para tomar decisiones importantes."

            };

        }


        return {

            title:
                "💀 EL CAOS TE ODIA",

            detail:
                "Guarda la cartera y vuelve mañana."

        };

    }



    /* ---------------------------------------------------------
       PUNTUACIÓN
       --------------------------------------------------------- */

    function calculateScore(luck) {

        if (luck >= 95) {

            return 250;

        }


        if (luck >= 80) {

            return 200;

        }


        if (luck >= 65) {

            return 150;

        }


        if (luck >= 50) {

            return 100;

        }


        if (luck >= 35) {

            return 75;

        }


        if (luck >= 20) {

            return 50;

        }


        return 25;

    }



    /* ---------------------------------------------------------
       RÉCORD
       --------------------------------------------------------- */

    function updateBestScore() {

        if (
            typeof window.CAOSLAB_STATS ===
            "undefined"
        ) {

            return;

        }


        const stats =
            window.CAOSLAB_STATS.get();


        const gameStats =
            stats.games.suerte;


        if (gameStats) {

            bestScoreText.textContent =
                gameStats.bestScore;

        }

    }



    /* ---------------------------------------------------------
       TEST
       --------------------------------------------------------- */

    function testLuck() {

        testButton.disabled =
            true;


        testButton.textContent =
            "🌀 CALCULANDO...";


        resultTitle.textContent =
            "🔮 CONSULTANDO AL UNIVERSO...";


        resultDetail.textContent =
            "Midiendo las fuerzas del caos.";


        percentage.textContent =
            "?";


        meterFill.style.width =
            "0%";


        shareButton.textContent =
            "📤 COMPARTIR RESULTADO";


        setTimeout(

            function () {

                currentLuck =
                    Math.floor(
                        Math.random() * 101
                    );


                const result =
                    getResult(
                        currentLuck
                    );


                currentScore =
                    calculateScore(
                        currentLuck
                    );


                percentage.textContent =
                    currentLuck + "%";


                meterFill.style.width =
                    currentLuck + "%";


                resultTitle.textContent =
                    result.title;


                resultDetail.textContent =
                    result.detail;


                currentScoreText.textContent =
                    currentScore;


                /* ---------------------------------------------
                   ESTADÍSTICAS
                   --------------------------------------------- */

                if (
                    typeof window.CAOSLAB_STATS !==
                    "undefined"
                ) {

                    window.CAOSLAB_STATS.recordGame(

                        "suerte",

                        "win",

                        currentScore

                    );


                    updateBestScore();

                }


                testButton.disabled =
                    false;


                testButton.textContent =
                    "🍀 PROBAR DE NUEVO";


                shareButton.style.display =
                    "block";

            },

            800

        );

    }



    /* ---------------------------------------------------------
       COMPARTIR
       --------------------------------------------------------- */

    function shareResult() {

        if (!currentLuck) {

            return;

        }


        const text =

            "🧠 Test de Suerte — CAOSLAB 🧪\n\n" +

            "🍀 Mi suerte de hoy: " +
            currentLuck +
            "%\n\n" +

            resultTitle.textContent +
            "\n" +

            resultDetail.textContent +
            "\n\n" +

            "Puntos: " +
            currentScore;


        if (
            navigator.share
        ) {

            navigator.share({

                title:
                    "CAOSLAB — Test de Suerte",

                text:
                    text

            }).catch(
                function () {}
            );


            return;

        }


        if (
            navigator.clipboard
        ) {

            navigator.clipboard
                .writeText(text)
                .then(

                    function () {

                        shareButton.textContent =
                            "✅ RESULTADO COPIADO";

                    }

                )
                .catch(

                    function () {

                        shareButton.textContent =
                            "📋 COPIA EL RESULTADO";

                    }

                );

        }

    }



    /* ---------------------------------------------------------
       EVENTOS
       --------------------------------------------------------- */

    testButton.addEventListener(

        "click",

        testLuck

    );


    shareButton.addEventListener(

        "click",

        shareResult

    );



    /* ---------------------------------------------------------
       INICIO
       --------------------------------------------------------- */

    updateBestScore();


})();

</script>


</body>

</html>
